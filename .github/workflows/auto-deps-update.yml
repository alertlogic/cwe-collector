name: Dependency Updates & Maintenance

on:
  push:
    branches: [integration]
  schedule:
    # Twice weekly: Monday and Thursday at 09:00 UTC
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    name: Update dependencies and fix vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install all dependencies
        run: npm install

      - name: Audit and fix vulnerabilities
        run: npm audit fix || true

      - name: Update npm overrides
        run: npm run update:overrides

      - name: Sync package-lock.json
        run: npm install --package-lock-only

      - name: Clean install for consistency
        run: npm ci

      - name: Run full test suite
        run: npm test

      - name: Run code linting
        run: npm run lint

      - name: Check for dependency changes
        id: changes
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependency changes detected"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes detected"
          fi

      - name: Build PR body
        if: steps.changes.outputs.changed == 'true'
        id: pr_body
        run: node scripts/update-overrides.js --pr-body

      - name: Bump patch version
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: |
          npm version patch --no-git-tag-version
          version="$(node -e "console.log(require('./package.json').version)")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Check for existing update PR
        if: steps.changes.outputs.changed == 'true'
        id: existing_pr
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.version.outputs.value }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const head = `${context.repo.owner}:chore/dependency-update-${process.env.VERSION}`;
            const { data } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head
            });
            core.setOutput('exists', data.length > 0 ? 'true' : 'false');

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true' && steps.existing_pr.outputs.exists != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/dependency-update-${{ steps.version.outputs.value }}
          commit-message: "chore: update dependencies and bump to v${{ steps.version.outputs.value }}"
          title: "chore: dependency updates -> v${{ steps.version.outputs.value }}"
          body: |
            ## Dependency Updates -> v${{ steps.version.outputs.value }}

            ${{ steps.pr_body.outputs.body }}
          labels: dependencies,automated
          delete-branch: false
